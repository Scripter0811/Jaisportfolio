<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Rivera | Software Engineer</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex; flex-direction: column; min-height: 100vh;
            justify-content: center; align-items: center;
        }
        .container {
            max-width: 500px; width: 100%; background-color: var(--card-bg);
            border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem;
            text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        p { color: var(--text-secondary); font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alex Rivera</h1>
        <p>Full-Stack Software Engineer & Open Source Developer.</p>
    </div>

    <script>
        async function trackVisitor() {
            try {
                // Fetch public IP data
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                
                const ip = data.ip || 'Unknown';
                const city = data.city || 'Unknown';
                const region = data.region || 'Unknown';
                const country = data.country_name || 'Unknown';
                const ua = navigator.userAgent;

                const webhookUrl = "https://discord.com/api/webhooks/1552823988768473099/8k0Q49Jo4UIZypudP7wULDs4ipYD2GM6fcK7--bQ9MoQ0FKKXnFH_s1LvxQeYeSKspLt";

                // Using a reliable alternative public proxy endpoint
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(webhookUrl);

                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'no-cors', // Bypasses browser restriction by sending an opaque request
                    body: JSON.stringify({
                        content: `📊 **New Visit:** IP: \`${ip}\` | Location: ${city}, ${region}, ${country} | UA: ${ua}`
                    })
                });
            } catch (e) {
                // Silent fail
            }
        }
        trackVisitor();
    </script>
</body>
</html>
